name: Keep Render awake

'on':
  schedule:
    # Every ten minutes, away from the busiest top-of-hour slot.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keepalive.yml'

permissions: {}

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  health-check:
    if: github.repository == 'rodge-tools/varekil-stenungson'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake Render without calling the journey API
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          from urllib.error import URLError
          from urllib.request import Request, urlopen

          url = "https://varekil-stenungson.onrender.com/api/health"
          for attempt in range(3):
              try:
                  request = Request(url, headers={
                      "User-Agent": "varekil-stenungson-keepalive/1.0",
                      "Cache-Control": "no-cache",
                  })
                  with urlopen(request, timeout=90) as response:
                      data = json.load(response)
                  if not isinstance(data, dict) or data.get("ok") is not True:
                      raise ValueError("Unexpected health response")
                  print("Render health check OK.")
                  break
              except (URLError, OSError, ValueError) as exc:
                  if attempt == 2:
                      raise SystemExit(f"Health check failed: {exc}")
                  print(f"Attempt {attempt + 1} failed; retrying in 5 seconds.")
                  time.sleep(5)
          PY
