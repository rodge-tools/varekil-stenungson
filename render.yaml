services:
  - type: web
    name: varekil-stenungson
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /api/health
    envVars:
      - key: VASTTRAFIK_CLIENT_ID
        sync: false
      - key: VASTTRAFIK_CLIENT_SECRET
        sync: false
      - key: STOP_A
        value: Varekil busstation
      - key: STOP_B
        value: Stenungsön
